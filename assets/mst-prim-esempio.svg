<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Esempio di costruzione di un minimum spanning tree con Prim</title>
  <desc id="desc">A sinistra un grafo completo su A, B, C e D, con costi AB 1, BC 2, CD 3, AC 3, BD 5 e AD 6. A destra Prim, partendo da A, sceglie in ordine AB, BC e CD. L'albero di copertura minimo ha costo 6.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #203048; }
    .heading { font-size: 25px; font-weight: 700; }
    .caption { font-size: 18px; fill: #53657a; }
    .edge { stroke: #a9b6c4; stroke-width: 3; }
    .chosen { stroke: #236f9e; stroke-width: 7; stroke-linecap: round; }
    .node { fill: #fff; stroke: #26364c; stroke-width: 3; }
    .node-label { font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .weight { font-size: 20px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 7px; }
    .step { font-size: 17px; font-weight: 700; fill: #236f9e; text-anchor: middle; }
  </style>

  <rect width="1120" height="500" rx="22" fill="#fff"/>
  <rect x="24" y="24" width="522" height="450" rx="16" fill="#f8fbfe" stroke="#dce5ee" stroke-width="2"/>
  <rect x="574" y="24" width="522" height="450" rx="16" fill="#f8fbfe" stroke="#dce5ee" stroke-width="2"/>

  <text class="heading" x="48" y="66">Grafo di partenza</text>
  <text class="caption" x="48" y="96">Ogni arco mostra il proprio costo</text>
  <line class="edge" x1="148" y1="170" x2="414" y2="170"/>
  <line class="edge" x1="414" y1="170" x2="414" y2="378"/>
  <line class="edge" x1="414" y1="378" x2="148" y2="378"/>
  <line class="edge" x1="148" y1="378" x2="148" y2="170"/>
  <line class="edge" x1="148" y1="170" x2="414" y2="378"/>
  <line class="edge" x1="414" y1="170" x2="148" y2="378"/>
  <text class="weight" x="281" y="150">1</text>
  <text class="weight" x="438" y="279">2</text>
  <text class="weight" x="281" y="409">3</text>
  <text class="weight" x="122" y="279">6</text>
  <text class="weight" x="237" y="224">3</text>
  <text class="weight" x="327" y="224">5</text>
  <circle class="node" cx="148" cy="170" r="23"/><text class="node-label" x="148" y="170">A</text>
  <circle class="node" cx="414" cy="170" r="23"/><text class="node-label" x="414" y="170">B</text>
  <circle class="node" cx="414" cy="378" r="23"/><text class="node-label" x="414" y="378">C</text>
  <circle class="node" cx="148" cy="378" r="23"/><text class="node-label" x="148" y="378">D</text>

  <text class="heading" x="598" y="66">MST costruito con Prim</text>
  <text class="caption" x="598" y="96">Si parte da A; gli archi blu sono scelti in ordine</text>
  <line class="chosen" x1="698" y1="170" x2="964" y2="170"/>
  <line class="chosen" x1="964" y1="170" x2="964" y2="378"/>
  <line class="chosen" x1="964" y1="378" x2="698" y2="378"/>
  <text class="weight" x="831" y="150">1</text>
  <text class="weight" x="988" y="279">2</text>
  <text class="weight" x="831" y="409">3</text>
  <text class="step" x="831" y="122">1º arco</text>
  <text class="step" x="1020" y="310">2º arco</text>
  <text class="step" x="831" y="443">3º arco</text>
  <circle class="node" cx="698" cy="170" r="23"/><text class="node-label" x="698" y="170">A</text>
  <circle class="node" cx="964" cy="170" r="23"/><text class="node-label" x="964" y="170">B</text>
  <circle class="node" cx="964" cy="378" r="23"/><text class="node-label" x="964" y="378">C</text>
  <circle class="node" cx="698" cy="378" r="23"/><text class="node-label" x="698" y="378">D</text>
</svg>
